{% extends "base.html" %}
{% block content %}
<h2>Nástroje pro správu</h2>

<div style="display: flex; gap: 10px; flex-wrap: wrap;">
    <!-- Tlačítko 1 -->
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="akce" value="opravit_vazby">
        <button type="submit" class="btn btn-warning">Přiřadit osiřelé zápasy k Létu D</button>
    </form>

    <!-- Tlačítko 2 -->
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="akce" value="vynutit_migrace">
        <button type="submit" class="btn btn-danger">Spustit nouzové migrace</button>
    </form>
	
	<form method="post">
			{% csrf_token %}
			<input type="hidden" name="akce" value="vygenerovat_zimni">
			<button type="submit" class="btn btn-primary">Vygenerovat zápasy pro zimní ligy</button>
	</form>
	
	<form method="post" action="{% url 'tenis_app:admin_tools' %}">
    {% csrf_token %}
    <input type="hidden" name="akce" value="generovat_jednu_ligu">
    
    <label for="soutez_id">Vyberte soutěž k vygenerování:</label>
    <select name="soutez_id" id="soutez_id" class="form-select mb-2" required>
        <option value="">-- Zvolte soutěž --</option>
        {% for soutez in souteze %}
            <option value="{{ soutez.slug }}">{{ soutez.nazev }} ({{ soutez.slug }})</option>
        {% endfor %}
    </select>
    
    <button type="submit" class="btn btn-primary">⚡ Vygenerovat soutěž</button>
</form>
</div>




{% if messages %}
    <ul style="margin-top: 20px;">
        {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}
{% endblock %}
